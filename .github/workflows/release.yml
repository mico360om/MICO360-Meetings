name: Release

# Tag a version to build + publish the installer, e.g.:  git tag v1.0.0 && git push --tags
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build-installer:
    runs-on: windows-latest
    permissions:
      contents: write          # needed to create the GitHub Release
    # Only yes/no FLAGS are job-wide (a step's own `env:` isn't visible to its
    # `if:`). The secrets themselves are passed solely to the step that uses
    # them, so dependency installs, PyInstaller and third-party actions never
    # see the Cloud key or the signing certificate.
    env:
      HAS_CONNECT_KEY: ${{ secrets.MICO360_CONNECT_API_KEY != '' }}
      HAS_SIGNING_CERT: ${{ secrets.CERT_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      # A tagged release must match the app's version (otherwise every client
      # installs it, still reports the old version, and is offered it forever).
      - name: Check tag matches app version
        if: ${{ github.ref_type == 'tag' }}
        run: |
          $ver = (Select-String -Path mico360\__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          if ("${{ github.ref_name }}" -ne "v$ver") {
            Write-Error "Tag ${{ github.ref_name }} does not match mico360.__version__ ($ver)."; exit 1
          }

      # Never publish a Cloud-disabled release by accident: existing users would
      # auto-update into an app whose Cloud mode no longer works.
      - name: Require the MICO360 Connect key for tagged releases
        if: ${{ github.ref_type == 'tag' && env.HAS_CONNECT_KEY != 'true' }}
        run: |
          Write-Error "The MICO360_CONNECT_API_KEY repository secret is not set — refusing to publish a Local-only release."
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints.txt

      # Exact tested versions (constraints.txt), incl. a pinned PyInstaller from
      # requirements-dev.txt, so every release resolves the same packages.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt -c constraints.txt

      # Live-meeting detection and Outlook calendar need pywin32. It is imported
      # lazily (features silently turn off without it), so fail loudly here.
      - name: Verify Windows integrations are installed
        run: python -c "import win32gui, pythoncom, win32com.client; print('pywin32 OK')"

      # Inject the MICO360 Connect API key (from a repo secret) so the shipped
      # installer has Cloud mode working with no end-user configuration.
      - name: Inject MICO360 Connect key
        if: ${{ env.HAS_CONNECT_KEY == 'true' }}
        env:
          MICO360_CONNECT_API_KEY: ${{ secrets.MICO360_CONNECT_API_KEY }}
        # Hex-encoded, so no character in the key can break the Python literal.
        run: |
          $key = "$env:MICO360_CONNECT_API_KEY".Trim()
          $hex = -join ([System.Text.Encoding]::UTF8.GetBytes($key) | ForEach-Object { $_.ToString("x2") })
          "KEY = bytes.fromhex('$hex').decode('utf-8')" | Out-File -Encoding ascii mico360\_build_key.py
          Write-Host "Injected MICO360 Connect key into the build."

      - name: Build app (PyInstaller)
        run: python -m PyInstaller build/mico360.spec --noconfirm --distpath build/dist --workpath build/work

      # Never publish a broken build: run the built-in self-test INSIDE the frozen
      # exe (bundled libraries, codecs, assets, exports incl. Arabic, history,
      # meeting detection, every UI page, ...). For tagged releases the Cloud key
      # must also be present in the build (reported as yes/no, never the value).
      - name: Self-test the built app
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $exe = "build\dist\MICO360Meetings\MICO360Meetings.exe"
          $rep = Join-Path $env:RUNNER_TEMP "selftest.json"
          $p = Start-Process -FilePath $exe -ArgumentList @('--self-test', '--report', "`"$rep`"", '--audio', 'samples\spoken_test.wav') -Wait -PassThru
          if (-not (Test-Path $rep)) { Write-Error "The built app wrote no self-test report (exit code $($p.ExitCode))."; exit 1 }
          $d = Get-Content $rep -Raw -Encoding UTF8 | ConvertFrom-Json
          $d.results | ForEach-Object { Write-Host ("{0,-5} {1} - {2}" -f $_.status.ToUpper(), $_.name, $_.detail) }
          if (-not $d.ok -or -not $d.frozen) { Write-Error "Built-app self-test failed ($($d.failed) required check(s))."; exit 1 }
          $key = $d.results | Where-Object { $_.name -eq 'MICO360 Cloud key bundled' }
          if ("${{ github.ref_type }}" -eq "tag" -and $key.status -ne 'pass') {
            Write-Error "Tagged release but the Cloud key is not in the build."; exit 1
          }
          Write-Host "Self-test: $($d.passed) passed, $($d.skipped) skipped, $($d.failed) failed."

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" build\installer.iss'

      # Optional code signing — runs only if CERT_PFX_BASE64 secret is configured.
      - name: Sign installer (optional)
        if: ${{ env.HAS_SIGNING_CERT == 'true' }}
        env:
          CERT_PFX_BASE64: ${{ secrets.CERT_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:CERT_PFX_BASE64))
          $st = "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe"
          $signtool = (Get-ChildItem $st | Select-Object -Last 1).FullName
          & $signtool sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:CERT_PASSWORD /fd SHA256 `
            /tr http://timestamp.digicert.com /td SHA256 build\Output\MICO360Meetings-Setup.exe

      # Publish the SHA256 AFTER any signing, so the hash matches the shipped binary.
      # The in-app updater fetches this and verifies the download before running it.
      - name: Compute SHA256 checksum
        run: |
          $setup = "build\Output\MICO360Meetings-Setup.exe"
          $sha = (Get-FileHash -Algorithm SHA256 $setup).Hash.ToLower()
          "$sha *MICO360Meetings-Setup.exe" | Out-File -Encoding ascii build\Output\SHA256SUMS.txt
          $sha | Out-File -Encoding ascii "$setup.sha256"
          Write-Host "SHA256: $sha"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MICO360Meetings-Setup
          path: |
            build/Output/MICO360Meetings-Setup.exe
            build/Output/SHA256SUMS.txt

      # One CI-built installer per release, described by the maintained release
      # notes (the in-app Updates page parses them into features / fixes).
      # Pre-release tags (e.g. v1.3.0-rc1) are published as pre-releases so the
      # updater's "latest" never points at them.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: build/RELEASE_NOTES_${{ github.ref_name }}.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            build/Output/MICO360Meetings-Setup.exe
            build/Output/MICO360Meetings-Setup.exe.sha256
            build/Output/SHA256SUMS.txt
